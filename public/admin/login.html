<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOUCSE Admin Login</title><style>
body{margin:0;background:#09090d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(400px,90%);background:#12121a;padding:30px;border-radius:18px;border:1px solid #3b2a75}.box h1{margin-top:0}.box input{width:100%;box-sizing:border-box;margin:8px 0;padding:13px;background:#09090d;border:1px solid #333;color:#fff;border-radius:9px}.box button{width:100%;padding:13px;background:#6c5ce7;color:#fff;border:0;border-radius:9px;margin-top:10px;cursor:pointer}.err{color:#ff7675;margin-top:12px}</style></head><body><div class="box"><h1>FOUCSE Admin</h1><p>Store control panel</p><form id="f"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Login</button><div id="e" class="err"></div></form></div><script>
f.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f));const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok){document.querySelector('#e').textContent=d.error;return}localStorage.setItem('foucse_admin_token',d.token);location='/admin/index.html'};
</script></body></html>
