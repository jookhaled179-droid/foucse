<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOUCSE Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090d;color:#f5f5f7;font-family:Arial,sans-serif}.top{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}.wrap{width:min(1250px,92%);margin:25px auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:#12121a;border:1px solid #28223d;border-radius:15px;padding:20px}.stat b{font-size:1.7rem}.panel{background:#12121a;border:1px solid #28223d;border-radius:15px;padding:20px;margin-top:20px;overflow:auto}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{background:#6c5ce7;color:#fff;border:0;padding:9px 13px;border-radius:8px;cursor:pointer}.danger{background:#8e2d3b}.muted{color:#aaa}.table{width:100%;border-collapse:collapse;margin-top:10px;min-width:850px}.table th,.table td{padding:11px;border-bottom:1px solid #25252e;text-align:left}.input{background:#09090d;color:#fff;border:1px solid #333;border-radius:7px;padding:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:15px}.modal.open{display:grid}.box{width:min(600px,100%);background:#12121a;border:1px solid #3b2a75;border-radius:15px;padding:20px}.box input,.box select{width:100%;margin:6px 0;padding:10px;background:#09090d;color:#fff;border:1px solid #333;border-radius:8px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style></head><body><header class="top"><strong>FOUCSE ADMIN</strong><div class="row"><a class="btn" href="/" target="_blank">Store</a><button class="btn danger" id="logout">Logout</button></div></header><main class="wrap">
<div class="stats"><div class="stat">Orders<br><b id="orders">0</b></div><div class="stat">Revenue<br><b id="revenue">0</b> EGP</div><div class="stat">Products<br><b id="products">0</b></div><div class="stat">Pending<br><b id="pending">0</b></div></div>
<section class="panel"><div class="row"><h2 style="margin-right:auto">Orders</h2><button class="btn" onclick="load()">Refresh</button></div><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Created</th></tr></thead><tbody id="ordersTable"></tbody></table></section>
<section class="panel"><div class="row"><h2 style="margin-right:auto">Products</h2><button class="btn" onclick="openProduct()">Add Product</button></div><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th>Actions</th></tr></thead><tbody id="productsTable"></tbody></table></section>
<section class="panel"><h2>Store Settings</h2><div class="row"><label>Shipping <input id="shipping" class="input" type="number"></label><label>WhatsApp <input id="whatsapp" class="input" placeholder="2010..."></label><button class="btn" onclick="saveSettings()">Save</button></div></section>
</main>
<div class="modal" id="pm"><div class="box"><h2 id="pt">Add Product</h2><form id="pf"><input name="id" type="hidden"><label>Name<input name="name" required></label><label>Category<select name="category"><option>hoodies</option><option>basics</option><option>jeans</option><option>wide-leg</option><option>shoes</option></select></label><div class="grid2"><label>Price<input name="price" type="number" required></label><label>Stock<input name="stock" type="number" required></label></div><label>Sizes (comma separated)<input name="sizes"></label><label>Image URL<input name="image"></label><div class="row" style="margin-top:12px"><button class="btn">Save</button><button type="button" class="btn danger" onclick="closeProduct()">Cancel</button></div></form></div></div>
<script>
const token=localStorage.getItem('foucse_admin_token');if(!token)location='/admin/login.html';
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token};const r=await fetch(u,o);if(r.status===401){localStorage.removeItem('foucse_admin_token');location='/admin/login.html';throw Error('Session expired, please login again')}const d=await r.json().catch(()=>{throw Error('Server returned an invalid response ('+r.status+'). Open the admin through the Node server (npm start), not Live Server or the file directly.')});if(!r.ok)throw Error(d.error||'Error');return d}
const money=n=>Number(n).toLocaleString('en-EG');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let productList=[];
async function load(){try{await render()}catch(e){alert('Admin error: '+e.message)}}
async function render(){const [s,os,ps,settings]=await Promise.all([api('/api/admin/summary'),api('/api/admin/orders'),api('/api/admin/products'),api('/api/admin/settings')]);orders.textContent=s.orders;revenue.textContent=money(s.revenue);products.textContent=s.products;pending.textContent=s.pending;shipping.value=settings.shipping;whatsapp.value=settings.whatsapp||'';
productList=ps;
ordersTable.innerHTML=os.map(o=>`<tr><td><b>${esc(o.id)}</b><br><small>${(o.items||[]).map(i=>esc(i.name)+' x'+esc(i.quantity)+(i.size?' ('+esc(i.size)+')':'')).join('<br>')}</small></td><td>${esc(o.customerName)}<br>${esc(o.governorate)}<br>${esc(o.address)}${o.notes?'<br><small class="muted">'+esc(o.notes)+'</small>':''}</td><td>${esc(o.phone)}</td><td>${money(o.total)} EGP</td><td><select class="input" onchange="setStatus('${esc(o.id)}',this.value)">${['new','processing','shipped','delivered','cancelled'].map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}</select></td><td>${new Date(o.createdAt).toLocaleString()}</td></tr>`).join('');
productsTable.innerHTML=ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${esc(p.stock)}</td><td>${p.active!==false?'Yes':'No'}</td><td><button class="btn" onclick="edit('${esc(p.id)}')">Edit</button> <button class="btn danger" onclick="del('${esc(p.id)}')">Delete</button></td></tr>`).join('')}
async function setStatus(id,status){try{await api('/api/admin/orders/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})})}catch(e){alert(e.message)}load()}
function openProduct(p={}){pt.textContent=p.id?'Edit Product':'Add Product';Object.keys(pf.elements).forEach(()=>{});for(const n of ['id','name','category','price','stock','image'])if(pf.elements[n])pf.elements[n].value=p[n]??'';pf.elements.sizes.value=(p.sizes||[]).join(', ');pm.classList.add('open')}
function edit(id){const p=productList.find(x=>x.id===id);if(p)openProduct(p)} function closeProduct(){pm.classList.remove('open')} 
pf.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(pf));b.sizes=b.sizes.split(',').map(x=>x.trim()).filter(Boolean);const id=b.id;delete b.id;try{await api('/api/admin/products'+(id?'/'+encodeURIComponent(id):''),{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})}catch(err){alert(err.message);return}closeProduct();load()}
async function del(id){if(confirm('Delete this product?')){try{await api('/api/admin/products/'+encodeURIComponent(id),{method:'DELETE'})}catch(e){alert(e.message)}load()}}
async function saveSettings(){await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({shipping:Number(shipping.value),whatsapp:whatsapp.value})}).then(()=>alert('Saved'),e=>alert(e.message))}
logout.onclick=()=>{localStorage.removeItem('foucse_admin_token');location='/admin/login.html'};load();
</script></body></html>
